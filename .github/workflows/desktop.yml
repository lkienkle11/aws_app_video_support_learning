name: Desktop checks and builds
on: [push, pull_request, workflow_dispatch]
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            bundle: app
          - os: ubuntu-24.04
            bundle: deb
          - os: windows-latest
            bundle: nsis
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Linux system WebView and codecs
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libssl-dev libxdo-dev gstreamer1.0-libav gstreamer1.0-plugins-good
      - run: npm ci
      - run: npm test
      - run: cargo fmt --all -- --check
      - run: cargo test --no-default-features --locked
      - run: node scripts/build-core.mjs
      - run: cargo clippy --all-targets -- -D warnings
      - run: npm run build -- --bundles ${{ matrix.bundle }}
      - name: macOS package size gate
        if: runner.os == 'macOS'
        run: node scripts/check-size.mjs "target/release/bundle/macos/Cloud Study.app"
      - name: Linux package size gate
        if: runner.os == 'Linux'
        run: node scripts/check-size.mjs target/release/bundle/deb/*.deb
      - name: Windows installer size gate
        if: runner.os == 'Windows'
        shell: pwsh
        run: Get-ChildItem target/release/bundle/nsis/*.exe | ForEach-Object { node scripts/check-size.mjs $_.FullName; if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE } }
      - uses: actions/upload-artifact@v4
        with:
          name: cloud-study-${{ matrix.os }}
          path: target/release/bundle/
