[package]
name = "cloud-study"
default-run = "cloud-study"
version = "0.1.0"
edition = "2021"
description = "Offline AWS learning desktop companion"
license = "MIT"

[features]
default = ["desktop"]
desktop = ["dep:tauri", "dep:tauri-plugin-dialog", "dep:tauri-build"]
custom-protocol = ["tauri/custom-protocol"]

[dependencies]
rusqlite = { version = "0.38", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
walkdir = "2"
unicode-normalization = "0.1"
tauri = { version = "2", features = ["protocol-asset"], optional = true }
tauri-plugin-dialog = { version = "2", optional = true }

[build-dependencies]
tauri-build = { version = "2", features = [], optional = true }

[dev-dependencies]
tempfile = "3"

[profile.release]
strip = true
lto = true
codegen-units = 1
opt-level = "s"
panic = "abort"

[[bin]]
name = "cloud-study"
path = "src/main.rs"
required-features = ["desktop"]

[[bin]]
name = "cloud-study-core"
path = "src/bin/core.rs"
